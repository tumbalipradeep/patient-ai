services:
  - type: web
    name: patient-ai
    runtime: docker
    plan: free
    region: oregon
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod

      - key: DATABASE_URL
        fromDatabase:
          name: Patientcase-db
          property: connectionString

      - key: DATABASE_USERNAME
        fromDatabase:
          name: Patientcase-db
          property: user

      - key: DATABASE_PASSWORD
        fromDatabase:
          name: Patientcase-db
          property: password

      - key: SERVER_PORT
        value: "8080"

      - key: APP_DOCUMENT_STORAGE_PATH
        value: /var/patientcase/documents

      - key: AI_ENABLED
        value: "true"

      - key: AI_API_URL
        value: https://openrouter.ai/api/v1/chat/completions

      - key: AI_MODEL
        value: openrouter/free

      - key: AI_API_KEY
        sync: false
