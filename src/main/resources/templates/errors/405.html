<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Method Not Allowed')}"></head>
<body class="login-body">
<div class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="text-center">
        <div class="mb-4">
            <i class="bi bi-ban text-warning" style="font-size: 4rem;"></i>
        </div>
        <h1 class="display-4 fw-bold text-warning">405</h1>
        <h2 class="h4 text-dark mb-3">Method Not Allowed</h2>
        <p class="text-muted mb-4" th:text="${errorMessage} ?: 'This URL does not support the requested HTTP method.'">
            This URL does not support the requested HTTP method.
        </p>
        <a th:href="@{/dashboard}" class="btn btn-primary">
            <i class="bi bi-house me-1"></i>Back to Dashboard
        </a>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
