<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Lifestyle (AYUSH)')}"></head>
<body class="app-body bg-light">
<div th:replace="~{fragments/kiosk-nav :: kiosk-nav}"></div>

<main class="container py-4" style="max-width:820px;">
    <div class="content-header d-flex justify-content-between align-items-center mb-4">
        <div>
            <h2 class="h4 fw-bold mb-0">
                <i class="bi bi-flower1 me-2 text-success"></i>Lifestyle &amp; constitution (AYUSH)
            </h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/kiosk/home}">Home</a></li>
                    <li class="breadcrumb-item">
                        <a th:href="@{/kiosk/intake/{id}(id=${intake.id})}">Intake</a>
                    </li>
                    <li class="breadcrumb-item active">Lifestyle</li>
                </ol>
            </nav>
        </div>
    </div>

    <div th:replace="~{fragments/alerts :: alerts}"></div>

    <p class="text-muted small mb-4">
        Optional — the Dashavidha Pariksha (ten-fold examination) helps the physician understand your
        constitution, dietary habits, and lifestyle. Answer what you can; leave the rest blank.
    </p>

    <form th:action="@{/kiosk/intake/{id}/ayush(id=${intake.id})}" method="post" th:object="${form}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <div class="card border-0 shadow-sm mb-4">
            <div class="card-header bg-white py-3">
                <h6 class="fw-bold mb-0">Dashavidha Pariksha</h6>
            </div>
            <div class="card-body">
                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="prakriti" class="form-label fw-semibold">Prakriti (constitution)</label>
                        <input type="text" id="prakriti" th:field="*{prakriti}" class="form-control"
                               placeholder="e.g. Vata-Pitta" maxlength="200"/>
                    </div>
                    <div class="col-md-6">
                        <label for="vikriti" class="form-label fw-semibold">Vikriti (current imbalance)</label>
                        <input type="text" id="vikriti" th:field="*{vikriti}" class="form-control"
                               placeholder="e.g. Kapha" maxlength="200"/>
                    </div>
                    <div class="col-md-6">
                        <label for="sara" class="form-label fw-semibold">Sara (tissue quality)</label>
                        <input type="text" id="sara" th:field="*{sara}" class="form-control"
                               placeholder="e.g. Saara, Madhyama" maxlength="100"/>
                    </div>
                    <div class="col-md-6">
                        <label for="samhanana" class="form-label fw-semibold">Samhanana (body build)</label>
                        <input type="text" id="samhanana" th:field="*{samhanana}" class="form-control"
                               placeholder="e.g. Krish, Sthool" maxlength="100"/>
                    </div>
                    <div class="col-md-6">
                        <label for="pramana" class="form-label fw-semibold">Pramana (body measurements)</label>
                        <input type="text" id="pramana" th:field="*{pramana}" class="form-control"
                               placeholder="e.g. height, weight" maxlength="100"/>
                    </div>
                    <div class="col-md-6">
                        <label for="satmya" class="form-label fw-semibold">Satmya (suitability)</label>
                        <input type="text" id="satmya" th:field="*{satmya}" class="form-control"
                               placeholder="e.g. oil, ghee" maxlength="100"/>
                    </div>
                    <div class="col-md-6">
                        <label for="satva" class="form-label fw-semibold">Satva (mental strength)</label>
                        <input type="text" id="satva" th:field="*{satva}" class="form-control"
                               placeholder="e.g. Pravar, Madhyam" maxlength="100"/>
                    </div>
                    <div class="col-md-6">
                        <label for="aharaShakti" class="form-label fw-semibold">Ahara Shakti (digestion)</label>
                        <input type="text" id="aharaShakti" th:field="*{aharaShakti}" class="form-control"
                               placeholder="e.g. Manda, Teekshna" maxlength="100"/>
                    </div>
                    <div class="col-md-6">
                        <label for="vyayamaShakti" class="form-label fw-semibold">Vyayama Shakti (exercise capacity)</label>
                        <input type="text" id="vyayamaShakti" th:field="*{vyayamaShakti}" class="form-control"
                               placeholder="e.g. Alpa, Uttam" maxlength="100"/>
                    </div>
                    <div class="col-md-6">
                        <label for="vaya" class="form-label fw-semibold">Vaya (age/life stage)</label>
                        <input type="text" id="vaya" th:field="*{vaya}" class="form-control"
                               placeholder="e.g. Balya, Madhyam" maxlength="100"/>
                    </div>
                    <div class="col-12">
                        <label for="aharaDetails" class="form-label fw-semibold">Ahara — diet details</label>
                        <textarea id="aharaDetails" th:field="*{aharaDetails}" class="form-control" rows="3"
                                  maxlength="2000" placeholder="Meal patterns, vegetarian/non-veg, spicy/sweet, timings"></textarea>
                    </div>
                    <div class="col-12">
                        <label for="viharaDetails" class="form-label fw-semibold">Vihara — lifestyle details</label>
                        <textarea id="viharaDetails" th:field="*{viharaDetails}" class="form-control" rows="3"
                                  maxlength="2000" placeholder="Sleep, exercise, work routine, habits"></textarea>
                    </div>
                    <div class="col-12">
                        <label for="notes" class="form-label fw-semibold">Additional notes</label>
                        <textarea id="notes" th:field="*{notes}" class="form-control" rows="2"
                                  maxlength="2000"></textarea>
                    </div>
                </div>
            </div>
        </div>

        <div class="d-flex gap-2">
            <button type="submit" class="btn btn-primary px-4 py-2 fw-semibold">
                <i class="bi bi-save me-2"></i>Save lifestyle details
            </button>
            <a th:href="@{/kiosk/intake/{id}/summary(id=${intake.id})}"
               class="btn btn-outline-secondary px-4 py-2">
                Back to summary
            </a>
        </div>
    </form>
</main>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
