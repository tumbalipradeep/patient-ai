<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Patient Registration')}"></head>
<body class="login-body">
<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100 py-4">
    <div class="login-card card shadow-lg border-0" style="max-width:580px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <div class="login-icon mb-3">
                    <i class="bi bi-person-plus-fill text-primary" style="font-size:2.5rem;"></i>
                </div>
                <h1 class="h3 fw-bold text-dark mb-1">Create your account</h1>
                <p class="text-muted small">Use this portal to prepare your case before the visit.</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger py-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}">Registration error</span>
            </div>

            <form th:action="@{/kiosk/register}" method="post" th:object="${form}">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="firstName" class="form-label fw-semibold">First name</label>
                        <input type="text" id="firstName" th:field="*{firstName}"
                               class="form-control" placeholder="e.g. Ananya" required maxlength="100"/>
                    </div>
                    <div class="col-md-6">
                        <label for="lastName" class="form-label fw-semibold">Last name</label>
                        <input type="text" id="lastName" th:field="*{lastName}"
                               class="form-control" placeholder="e.g. Sharma" required maxlength="100"/>
                    </div>
                </div>

                <div class="row g-3 mt-0">
                    <div class="col-md-6">
                        <label for="dateOfBirth" class="form-label fw-semibold">Date of birth</label>
                        <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}"
                               class="form-control" required/>
                    </div>
                    <div class="col-md-6">
                        <label for="gender" class="form-label fw-semibold">Gender</label>
                        <select id="gender" th:field="*{gender}" class="form-select" required>
                            <option value="" disabled selected>Select…</option>
                            <option value="MALE">Male</option>
                            <option value="FEMALE">Female</option>
                            <option value="OTHER">Other</option>
                        </select>
                    </div>
                </div>

                <div class="row g-3 mt-0">
                    <div class="col-md-6">
                        <label for="phone" class="form-label fw-semibold">Phone</label>
                        <input type="tel" id="phone" th:field="*{phone}"
                               class="form-control" placeholder="10-digit mobile number"
                               pattern="^[0-9+\-\s]{10,15}$" required/>
                    </div>
                    <div class="col-md-6">
                        <label for="email" class="form-label fw-semibold">Email</label>
                        <input type="email" id="email" th:field="*{email}"
                               class="form-control" placeholder="you@example.com" required maxlength="255"/>
                    </div>
                </div>

                <div class="mb-3 mt-4">
                    <label for="address" class="form-label fw-semibold">Address (optional)</label>
                    <input type="text" id="address" th:field="*{address}"
                           class="form-control" placeholder="Street, city" maxlength="500"/>
                </div>

                <hr class="my-4"/>

                <div class="row g-3">
                    <div class="col-md-6">
                        <label for="username" class="form-label fw-semibold">Username</label>
                        <input type="text" id="username" th:field="*{username}"
                               class="form-control" placeholder="min 3 characters"
                               required minlength="3" maxlength="50"/>
                    </div>
                    <div class="col-md-6">
                        <label for="patientNumber" class="form-label fw-semibold">
                            Existing patient number (optional)
                        </label>
                        <input type="text" id="patientNumber" th:field="*{patientNumber}"
                               class="form-control" placeholder="e.g. P-000123" maxlength="20"/>
                    </div>
                </div>

                <div class="row g-3 mt-0">
                    <div class="col-md-6">
                        <label for="password" class="form-label fw-semibold">Password</label>
                        <input type="password" id="password" th:field="*{password}"
                               class="form-control" placeholder="at least 8 characters"
                               required minlength="8" maxlength="72" autocomplete="new-password"/>
                    </div>
                    <div class="col-md-6">
                        <label for="confirmPassword" class="form-label fw-semibold">Confirm password</label>
                        <input type="password" id="confirmPassword" th:field="*{confirmPassword}"
                               class="form-control" placeholder="repeat password"
                               required maxlength="72" autocomplete="new-password"/>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 mt-4 fw-semibold">
                    <i class="bi bi-person-check me-2"></i>Create Account
                </button>
            </form>

            <hr class="my-4"/>
            <p class="text-muted small text-center mb-0">
                Already registered?
                <a th:href="@{/kiosk/login(lang=${lang ?: 'en'})}">Sign in</a> ·
                <a th:href="@{/kiosk}">Choose another language</a>
            </p>
        </div>
        <div class="card-footer bg-light text-center py-3">
            <p class="text-muted mb-0" style="font-size:0.7rem;">
                <i class="bi bi-shield-check me-1 text-success"></i>
                Your personal information is secured and used only for your care.
            </p>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}" th:remove="tag"></div>
</body>
</html>
