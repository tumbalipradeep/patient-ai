<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Patient Sign In')}"></head>
<body class="login-body">
<div class="login-wrapper d-flex align-items-center justify-content-center min-vh-100">
    <div class="login-card card shadow-lg border-0" style="max-width:460px;">
        <div class="card-body p-5">
            <div class="text-center mb-4">
                <div class="login-icon mb-3">
                    <i class="bi bi-heart-pulse-fill text-primary" style="font-size:2.5rem;"></i>
                </div>
                <h1 class="h3 fw-bold text-dark mb-1">MediKiosk</h1>
                <p class="text-muted small">Patient sign in</p>
            </div>

            <div th:if="${errorMessage}" class="alert alert-danger py-2" role="alert">
                <i class="bi bi-exclamation-triangle-fill me-2"></i>
                <span th:text="${errorMessage}">Invalid credentials</span>
            </div>
            <div th:if="${infoMessage}" class="alert alert-success py-2" role="alert">
                <i class="bi bi-check-circle-fill me-2"></i>
                <span th:text="${infoMessage}">Message</span>
            </div>

            <form th:action="@{/login}" method="post" novalidate>
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                <input type="hidden" name="lang" th:value="${lang ?: 'en'}"/>

                <div class="mb-3">
                    <label for="username" class="form-label fw-semibold">Username</label>
                    <input type="text" id="username" name="username"
                           class="form-control form-control-lg"
                           placeholder="Enter your username"
                           autocomplete="username" required autofocus/>
                </div>
                <div class="mb-4">
                    <label for="password" class="form-label fw-semibold">Password</label>
                    <input type="password" id="password" name="password"
                           class="form-control form-control-lg"
                           placeholder="Enter your password"
                           autocomplete="current-password" required/>
                </div>

                <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold">
                    <i class="bi bi-box-arrow-in-right me-2"></i>Sign In
                </button>
            </form>

            <hr class="my-4"/>
            <p class="text-muted small text-center mb-0">
                New patient?
                <a th:href="@{/kiosk/register(lang=${lang ?: 'en'})}">Create an account</a>
            </p>
        </div>
        <div class="card-footer bg-light text-center py-3">
            <p class="text-muted mb-0" style="font-size:0.7rem;">
                <i class="bi bi-shield-check me-1 text-success"></i>
                Clinical information must be reviewed by a qualified healthcare professional.
            </p>
        </div>
    </div>
</div>
<div th:replace="~{fragments/footer :: footer}" th:remove="tag"></div>
</body>
</html>
