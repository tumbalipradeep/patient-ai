<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Patients')}"></head>
<body class="app-body">
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div class="content-header d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="h4 mb-0 fw-bold">Patients</h2>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                        <li class="breadcrumb-item active">Patients</li>
                    </ol>
                </nav>
            </div>
            <a th:href="@{/patients/new}" class="btn btn-primary">
                <i class="bi bi-person-plus me-1"></i>Register Patient
            </a>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-bottom py-3">
                <form th:action="@{/patients}" method="get" class="d-flex gap-2">
                    <div class="input-group" style="max-width: 400px;">
                        <span class="input-group-text bg-light"><i class="bi bi-search"></i></span>
                        <input type="text" name="search" class="form-control"
                               placeholder="Search by name, number, or phone..."
                               th:value="${search}"
                               aria-label="Search patients"/>
                    </div>
                    <button type="submit" class="btn btn-outline-primary">Search</button>
                    <a th:href="@{/patients}" class="btn btn-outline-secondary" th:if="${search != null and !search.isEmpty()}">
                        <i class="bi bi-x"></i> Clear
                    </a>
                </form>
            </div>
            <div class="card-body p-0">
                <div th:if="${patients.isEmpty()}" class="text-center py-5 text-muted">
                    <i class="bi bi-person-x fs-1 d-block mb-3"></i>
                    <h5>No patients found</h5>
                    <p class="mb-3" th:if="${search != null and !search.isEmpty()}">
                        No results for "<span th:text="${search}"></span>"
                    </p>
                    <a th:href="@{/patients/new}" class="btn btn-primary">Register First Patient</a>
                </div>
                <div class="table-responsive" th:unless="${patients.isEmpty()}">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th scope="col">Patient Number</th>
                                <th scope="col">Name</th>
                                <th scope="col">Date of Birth</th>
                                <th scope="col">Gender</th>
                                <th scope="col">Phone</th>
                                <th scope="col">Registered</th>
                                <th scope="col" class="text-end">Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="patient : ${patients.content}">
                                <td>
                                    <span class="badge bg-light text-dark fw-semibold"
                                          th:text="${patient.patientNumber}">P-000001</span>
                                </td>
                                <td>
                                    <a th:href="@{/patients/{id}(id=${patient.id})}"
                                       class="fw-semibold text-decoration-none"
                                       th:text="${patient.fullName}">Name</a>
                                </td>
                                <td>
                                    <span th:text="${#temporals.format(patient.dateOfBirth, 'dd MMM yyyy')}">DOB</span>
                                    <span class="text-muted small ms-1" th:text="'(' + ${patient.age} + ' yrs)'"></span>
                                </td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${patient.gender.name() == 'MALE'} ? 'bg-primary' : (${patient.gender.name() == 'FEMALE'} ? 'bg-danger' : 'bg-secondary')"
                                          th:text="${patient.gender}">Gender</span>
                                </td>
                                <td th:text="${patient.phone ?: '—'}">Phone</td>
                                <td th:text="${#temporals.format(patient.createdAt, 'dd MMM yyyy')}">Date</td>
                                <td class="text-end">
                                    <a th:href="@{/patients/{id}(id=${patient.id})}"
                                       class="btn btn-sm btn-outline-primary me-1"
                                       title="View Patient">
                                        <i class="bi bi-eye"></i>
                                    </a>
                                    <a th:href="@{/patients/{id}/edit(id=${patient.id})}"
                                       class="btn btn-sm btn-outline-secondary"
                                       title="Edit Patient">
                                        <i class="bi bi-pencil"></i>
                                    </a>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="card-footer bg-white d-flex justify-content-between align-items-center py-3"
                 th:unless="${patients.isEmpty()}">
                <small class="text-muted">
                    Showing <span th:text="${patients.numberOfElements}">0</span>
                    of <span th:text="${patients.totalElements}">0</span> patients
                </small>
                <div th:replace="~{fragments/pagination :: pagination(${currentPage}, ${totalPages}, '/patients')}"></div>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
