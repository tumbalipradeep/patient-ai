<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Edit Patient')}"></head>
<body class="app-body">
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div class="content-header mb-4">
            <h2 class="h4 mb-0 fw-bold">Edit Patient</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/patients}">Patients</a></li>
                    <li class="breadcrumb-item">
                        <a th:href="@{/patients/{id}(id=${patient.id})}" th:text="${patient.fullName}">Patient</a>
                    </li>
                    <li class="breadcrumb-item active">Edit</li>
                </ol>
            </nav>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white border-bottom py-3 d-flex align-items-center">
                <h5 class="mb-0 fw-semibold">
                    <i class="bi bi-pencil me-2 text-primary"></i>
                    Editing: <span th:text="${patient.fullName}">Name</span>
                    <span class="badge bg-light text-dark ms-2" th:text="${patient.patientNumber}">Number</span>
                </h5>
            </div>
            <div class="card-body p-4">
                <form th:action="@{/patients/{id}/edit(id=${patient.id})}" method="post"
                      th:object="${patientForm}" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                    <div class="row g-3 mb-4">
                        <div class="col-md-4">
                            <label for="firstName" class="form-label required">First Name</label>
                            <input type="text" id="firstName" th:field="*{firstName}"
                                   class="form-control" th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'" required/>
                            <div class="invalid-feedback" th:errors="*{firstName}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="lastName" class="form-label required">Last Name</label>
                            <input type="text" id="lastName" th:field="*{lastName}"
                                   class="form-control" th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'" required/>
                            <div class="invalid-feedback" th:errors="*{lastName}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="dateOfBirth" class="form-label required">Date of Birth</label>
                            <input type="date" id="dateOfBirth" th:field="*{dateOfBirth}"
                                   class="form-control" th:classappend="${#fields.hasErrors('dateOfBirth')} ? 'is-invalid'" required/>
                            <div class="invalid-feedback" th:errors="*{dateOfBirth}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="gender" class="form-label required">Gender</label>
                            <select id="gender" th:field="*{gender}" class="form-select"
                                    th:classappend="${#fields.hasErrors('gender')} ? 'is-invalid'" required>
                                <option th:each="g : ${genders}" th:value="${g}" th:text="${g}"></option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{gender}"></div>
                        </div>
                        <div class="col-md-4">
                            <label for="bloodGroup" class="form-label">Blood Group</label>
                            <select id="bloodGroup" th:field="*{bloodGroup}" class="form-select">
                                <option value="">Unknown</option>
                                <option th:each="bg : ${bloodGroups}" th:value="${bg}" th:text="${bg}"></option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label for="phone" class="form-label">Phone</label>
                            <input type="tel" id="phone" th:field="*{phone}" class="form-control"/>
                        </div>
                        <div class="col-md-6">
                            <label for="email" class="form-label">Email</label>
                            <input type="email" id="email" th:field="*{email}" class="form-control"
                                   th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                            <div class="invalid-feedback" th:errors="*{email}"></div>
                        </div>
                        <div class="col-12">
                            <label for="address" class="form-label">Address</label>
                            <textarea id="address" th:field="*{address}" class="form-control" rows="2"></textarea>
                        </div>
                        <div class="col-md-6">
                            <label for="emergencyContactName" class="form-label">Emergency Contact Name</label>
                            <input type="text" id="emergencyContactName" th:field="*{emergencyContactName}" class="form-control"/>
                        </div>
                        <div class="col-md-6">
                            <label for="emergencyContactPhone" class="form-label">Emergency Contact Phone</label>
                            <input type="tel" id="emergencyContactPhone" th:field="*{emergencyContactPhone}" class="form-control"/>
                        </div>
                        <div class="col-12">
                            <label for="allergies" class="form-label">Known Allergies</label>
                            <textarea id="allergies" th:field="*{allergies}" class="form-control" rows="2"></textarea>
                        </div>
                    </div>

                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-check-lg me-1"></i>Save Changes
                        </button>
                        <a th:href="@{/patients/{id}(id=${patient.id})}" class="btn btn-outline-secondary">
                            <i class="bi bi-x me-1"></i>Cancel
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
