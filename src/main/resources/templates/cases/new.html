<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Create New Case')}"></head>
<body class="app-body">
<div class="app-layout">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <main class="main-content">
        <div class="content-header mb-4">
            <h2 class="h4 mb-1 fw-bold">Create New Case</h2>
            <p class="text-muted mb-0">Create a clinical case for this patient.</p>
        </div>

        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">

                <form th:action="@{/cases/new}" method="post"
                      th:object="${caseForm}" novalidate>

                    <input type="hidden"
                           th:name="${_csrf.parameterName}"
                           th:value="${_csrf.token}"/>

                    <input type="hidden" th:field="*{patientId}"/>

                    <div class="mb-3">
                        <label for="caseTitle" class="form-label required">Case Title</label>
                        <input type="text"
                               id="caseTitle"
                               th:field="*{title}"
                               class="form-control"
                               placeholder="Brief description of the case"
                               required>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('title')}"
                             th:errors="*{title}"></div>
                    </div>

                    <div class="mb-3">
                        <label for="chiefComplaint" class="form-label required">
                            Chief Complaint
                        </label>
                        <textarea id="chiefComplaint"
                                  th:field="*{chiefComplaint}"
                                  class="form-control"
                                  rows="4"
                                  placeholder="Patient's primary complaint..."
                                  required></textarea>
                        <div class="invalid-feedback d-block"
                             th:if="${#fields.hasErrors('chiefComplaint')}"
                             th:errors="*{chiefComplaint}"></div>
                    </div>

                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="caseStatus" class="form-label">Status</label>
                            <select id="caseStatus"
                                    th:field="*{status}"
                                    class="form-select">
                                <option th:each="s : ${caseStatuses}"
                                        th:value="${s}"
                                        th:text="${s}">
                                </option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label for="casePriority" class="form-label">Priority</label>
                            <select id="casePriority"
                                    th:field="*{priority}"
                                    class="form-select">
                                <option th:each="p : ${casePriorities}"
                                        th:value="${p}"
                                        th:text="${p}">
                                </option>
                            </select>
                        </div>
                    </div>

                    <div class="d-flex gap-2 mt-4">
                        <a th:href="@{/patients/{id}(id=${caseForm.patientId})}"
                           class="btn btn-outline-secondary">
                            Cancel
                        </a>

                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-folder-plus me-1"></i>
                            Create Case
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </main>
</div>

<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
