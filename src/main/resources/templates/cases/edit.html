<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Edit Case')}"></head>
<body class="app-body">
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div class="content-header mb-4">
            <h2 class="h4 mb-0 fw-bold">Edit Case</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item">
                        <a th:href="@{/cases/{id}(id=${patientCase.id})}" th:text="${patientCase.caseNumber}">Case</a>
                    </li>
                    <li class="breadcrumb-item active">Edit</li>
                </ol>
            </nav>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form th:action="@{/cases/{id}/edit(id=${patientCase.id})}" method="post"
                      th:object="${caseForm}" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="mb-3">
                        <label for="title" class="form-label required">Title</label>
                        <input type="text" id="title" th:field="*{title}" class="form-control"
                               th:classappend="${#fields.hasErrors('title')} ? 'is-invalid'" required/>
                        <div class="invalid-feedback" th:errors="*{title}"></div>
                    </div>
                    <div class="mb-3">
                        <label for="chiefComplaint" class="form-label required">Chief Complaint</label>
                        <textarea id="chiefComplaint" th:field="*{chiefComplaint}" class="form-control"
                                  th:classappend="${#fields.hasErrors('chiefComplaint')} ? 'is-invalid'"
                                  rows="3" required></textarea>
                        <div class="invalid-feedback" th:errors="*{chiefComplaint}"></div>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label for="status" class="form-label">Status</label>
                            <select id="status" th:field="*{status}" class="form-select">
                                <option th:each="s : ${statuses}" th:value="${s}" th:text="${s}"></option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label for="priority" class="form-label">Priority</label>
                            <select id="priority" th:field="*{priority}" class="form-select">
                                <option th:each="p : ${priorities}" th:value="${p}" th:text="${p}"></option>
                            </select>
                        </div>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save Changes</button>
                        <a th:href="@{/cases/{id}(id=${patientCase.id})}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
