<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <title th:text="${title} + ' | PatientCase'">PatientCase</title>
    <!-- Bootstrap 5.3.2 CSS — served locally, no CDN dependency -->
    <link rel="stylesheet" th:href="@{/css/vendor/bootstrap.min.css}"/>
    <!-- Bootstrap Icons 1.11.1 CSS — served locally -->
    <link rel="stylesheet" th:href="@{/css/vendor/bootstrap-icons.min.css}"/>
    <!-- Custom CSS -->
    <link rel="stylesheet" th:href="@{/css/app.css}"/>
    <!-- CSRF meta tags for AJAX -->
    <th:block th:if="${_csrf != null}">
        <meta name="_csrf" th:content="${_csrf.token}"/>
        <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
    </th:block>
</head>
</html>
