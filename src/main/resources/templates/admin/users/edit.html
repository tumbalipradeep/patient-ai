<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Edit User')}"></head>
<body class="app-body">
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div class="content-header mb-4">
            <h2 class="h4 mb-0 fw-bold">Edit User</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/admin/users}">Users</a></li>
                    <li class="breadcrumb-item active" th:text="${user.username}">User</li>
                </ol>
            </nav>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="row justify-content-center">
            <div class="col-md-7">
                <div class="card border-0 shadow-sm">
                    <div class="card-header bg-white py-3">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-person-circle fs-4 text-primary"></i>
                            <div>
                                <div class="fw-semibold" th:text="${user.fullName}">Name</div>
                                <small class="text-muted"><code th:text="${user.username}">username</code></small>
                            </div>
                        </div>
                    </div>
                    <div class="card-body p-4">

                        <div th:if="${errorMessage}" class="alert alert-danger py-2">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${errorMessage}">Error</span>
                        </div>

                        <form th:action="@{/admin/users/{id}/edit(id=${user.id})}" method="post"
                              th:object="${userForm}" novalidate>
                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label for="firstName" class="form-label fw-semibold">First Name</label>
                                    <input type="text" id="firstName" th:field="*{firstName}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('firstName')} ? 'is-invalid'"/>
                                    <div class="invalid-feedback" th:errors="*{firstName}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="lastName" class="form-label fw-semibold">Last Name</label>
                                    <input type="text" id="lastName" th:field="*{lastName}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('lastName')} ? 'is-invalid'"/>
                                    <div class="invalid-feedback" th:errors="*{lastName}"></div>
                                </div>
                                <div class="col-md-12">
                                    <label for="email" class="form-label fw-semibold">Email</label>
                                    <input type="email" id="email" th:field="*{email}"
                                           class="form-control"
                                           th:classappend="${#fields.hasErrors('email')} ? 'is-invalid'"/>
                                    <div class="invalid-feedback" th:errors="*{email}"></div>
                                </div>
                                <div class="col-md-6">
                                    <label for="role" class="form-label fw-semibold">Role</label>
                                    <select id="role" th:field="*{role}" class="form-select"
                                            th:classappend="${#fields.hasErrors('role')} ? 'is-invalid'">
                                        <option th:each="r : ${roles}" th:value="${r}" th:text="${r}"></option>
                                    </select>
                                    <div class="invalid-feedback" th:errors="*{role}"></div>
                                </div>
                            </div>

                            <div class="alert alert-light border small mt-3">
                                <i class="bi bi-info-circle me-1 text-info"></i>
                                To change this user's password, use the Change Password function while logged in as that user,
                                or add an admin password-reset feature.
                            </div>

                            <div class="d-flex gap-2 mt-3">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-save me-1"></i>Save Changes
                                </button>
                                <a th:href="@{/admin/users}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
