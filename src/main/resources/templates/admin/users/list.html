<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('User Management')}"></head>
<body class="app-body">
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div class="content-header d-flex justify-content-between align-items-center mb-4">
            <div>
                <h2 class="h4 mb-0 fw-bold"><i class="bi bi-people-fill me-2 text-primary"></i>User Management</h2>
                <nav aria-label="breadcrumb">
                    <ol class="breadcrumb mb-0">
                        <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                        <li class="breadcrumb-item active">Users</li>
                    </ol>
                </nav>
            </div>
            <a th:href="@{/admin/users/new}" class="btn btn-primary btn-sm">
                <i class="bi bi-person-plus me-1"></i>New User
            </a>
        </div>

        <div th:replace="~{fragments/alerts :: alerts}"></div>

        <div class="card border-0 shadow-sm">
            <div class="card-header bg-white py-3">
                <h6 class="fw-semibold mb-0">All Users (<span th:text="${users.size()}">0</span>)</h6>
            </div>
            <div class="card-body p-0">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Name</th>
                                <th>Username</th>
                                <th>Email</th>
                                <th>Role</th>
                                <th>Status</th>
                                <th>Created</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="u : ${users}">
                                <td class="fw-semibold small" th:text="${u.fullName}">Name</td>
                                <td class="small"><code th:text="${u.username}">username</code></td>
                                <td class="small text-muted" th:text="${u.email}">email</td>
                                <td>
                                    <span class="badge"
                                          th:classappend="${u.role.name() == 'ADMIN'} ? 'bg-danger' :
                                                          (${u.role.name() == 'DOCTOR'} ? 'bg-primary' :
                                                          (${u.role.name() == 'NURSE'} ? 'bg-success' : 'bg-secondary'))"
                                          th:text="${u.role}">Role</span>
                                </td>
                                <td>
                                    <span th:if="${u.enabled}" class="badge bg-success">Active</span>
                                    <span th:unless="${u.enabled}" class="badge bg-secondary">Disabled</span>
                                </td>
                                <td class="small text-muted"
                                    th:text="${#temporals.format(u.createdAt, 'dd MMM yyyy')}">Date</td>
                                <td>
                                    <div class="d-flex gap-1">
                                        <a th:href="@{/admin/users/{id}/edit(id=${u.id})}"
                                           class="btn btn-outline-secondary btn-sm" title="Edit">
                                            <i class="bi bi-pencil"></i>
                                        </a>
                                        <form th:if="${u.enabled}"
                                              th:action="@{/admin/users/{id}/disable(id=${u.id})}"
                                              method="post" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="btn btn-outline-warning btn-sm"
                                                    title="Disable"
                                                    data-confirm="Disable this user account?">
                                                <i class="bi bi-person-dash"></i>
                                            </button>
                                        </form>
                                        <form th:unless="${u.enabled}"
                                              th:action="@{/admin/users/{id}/enable(id=${u.id})}"
                                              method="post" class="d-inline">
                                            <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                                            <button type="submit" class="btn btn-outline-success btn-sm"
                                                    title="Enable">
                                                <i class="bi bi-person-check"></i>
                                            </button>
                                        </form>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
