<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{fragments/head :: head('Schedule Appointment')}"></head>
<body class="app-body">
<div class="app-layout">
    <div th:replace="~{fragments/sidebar :: sidebar}"></div>
    <main class="main-content">
        <div class="content-header mb-4">
            <h2 class="h4 mb-0 fw-bold">Schedule Appointment</h2>
            <nav aria-label="breadcrumb">
                <ol class="breadcrumb mb-0">
                    <li class="breadcrumb-item"><a th:href="@{/dashboard}">Dashboard</a></li>
                    <li class="breadcrumb-item"><a th:href="@{/appointments}">Appointments</a></li>
                    <li class="breadcrumb-item active">New</li>
                </ol>
            </nav>
        </div>
        <div th:replace="~{fragments/alerts :: alerts}"></div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form th:action="@{/appointments/new}" method="post" th:object="${appointmentForm}" novalidate>
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label for="patientId" class="form-label required">Patient</label>
                            <select id="patientId" th:field="*{patientId}" class="form-select"
                                    th:classappend="${#fields.hasErrors('patientId')} ? 'is-invalid'" required>
                                <option value="">Select patient...</option>
                                <option th:each="p : ${patients}"
                                        th:value="${p.id}"
                                        th:text="${p.fullName + ' (' + p.patientNumber + ')'}">Patient</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{patientId}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="clinicianId" class="form-label required">Clinician</label>
                            <select id="clinicianId" th:field="*{clinicianId}" class="form-select"
                                    th:classappend="${#fields.hasErrors('clinicianId')} ? 'is-invalid'" required>
                                <option value="">Select clinician...</option>
                                <option th:each="c : ${clinicians}"
                                        th:value="${c.id}"
                                        th:text="${c.fullName + ' (' + c.role + ')'}">Clinician</option>
                            </select>
                            <div class="invalid-feedback" th:errors="*{clinicianId}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="appointmentDatetime" class="form-label required">Date &amp; Time</label>
                            <input type="datetime-local" id="appointmentDatetime" th:field="*{appointmentDatetime}"
                                   class="form-control" th:classappend="${#fields.hasErrors('appointmentDatetime')} ? 'is-invalid'"
                                   required/>
                            <div class="invalid-feedback" th:errors="*{appointmentDatetime}"></div>
                        </div>
                        <div class="col-md-6">
                            <label for="reason" class="form-label">Reason</label>
                            <input type="text" id="reason" th:field="*{reason}" class="form-control"
                                   placeholder="Reason for appointment"/>
                        </div>
                        <div class="col-12">
                            <label for="notes" class="form-label">Notes</label>
                            <textarea id="notes" th:field="*{notes}" class="form-control" rows="2"
                                      placeholder="Additional notes..."></textarea>
                        </div>
                    </div>
                    <div class="d-flex gap-2 mt-4">
                        <button type="submit" class="btn btn-primary">
                            <i class="bi bi-calendar-plus me-1"></i>Schedule Appointment
                        </button>
                        <a th:href="@{/appointments}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </main>
</div>
<div th:replace="~{fragments/footer :: footer}"></div>
</body>
</html>
