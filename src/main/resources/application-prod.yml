# ============================================================
# Production Profile — application-prod.yml
# Activated via: SPRING_PROFILES_ACTIVE=prod
# All sensitive values MUST be provided via environment variables.
# Never hardcode credentials in this file.
# ============================================================

spring:
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      keepalive-time: 300000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

  flyway:
    enabled: true
    validate-on-migrate: true
    baseline-on-migrate: false

  thymeleaf:
    cache: true
    mode: HTML
    encoding: UTF-8

  web:
    resources:
      cache:
        period: 86400        # 24-hour static asset cache

  mvc:
    hiddenmethod:
      filter:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
  error:
    whitelabel:
      enabled: false
  # Enable compression for text responses in production
  compression:
    enabled: true
    mime-types: text/html,text/css,application/javascript,application/json
    min-response-size: 2048

logging:
  level:
    root: WARN
    com.patientcase: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  document:
    storage-path: ${APP_DOCUMENT_STORAGE_PATH}
  ai:
    api-url: ${AI_API_URL:https://api.openai.com/v1/chat/completions}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gpt-4o-mini}
    enabled: ${AI_ENABLED:false}

# Actuator — only health exposed, no sensitive details
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  server:
    # Keep actuator on same port — /actuator/health is already public-safe
    port: ${SERVER_PORT:8080}
