spring:
  application:
    name: ai-patient-case-system

  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/patientcase}
    username: ${DATABASE_USERNAME:patientcase}
    password: ${DATABASE_PASSWORD:patientcase}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        default_schema: public
    open-in-view: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
    validate-on-migrate: true

  thymeleaf:
    cache: false
    mode: HTML
    encoding: UTF-8

  web:
    resources:
      cache:
        period: 0

  mvc:
    hiddenmethod:
      filter:
        enabled: true

server:
  port: ${SERVER_PORT:8080}
  servlet:
    session:
      timeout: 30m
  error:
    whitelabel:
      enabled: false

logging:
  level:
    com.patientcase: INFO
    org.springframework.security: WARN
    org.flywaydb: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"

app:
  document:
    storage-path: ${APP_DOCUMENT_STORAGE_PATH:${user.home}/patientcase-documents}
