spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
    driver-class-name: org.h2.Driver

  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    show-sql: false
    defer-datasource-initialization: true

  flyway:
    enabled: false

  sql:
    init:
      schema-locations: classpath:test-sequences.sql
      mode: always

  thymeleaf:
    cache: false

logging:
  level:
    com.patientcase: DEBUG
    org.springframework.security: DEBUG

app:
  document:
    storage-path: /tmp/patientcase-test-documents
