version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: patientcase-postgres
    environment:
      POSTGRES_DB: patientcase
      POSTGRES_USER: patientcase
      POSTGRES_PASSWORD: patientcase
    ports:
      - "5432:5432"
    volumes:
      - patientcase-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patientcase -d patientcase"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  patientcase-pgdata:
    driver: local
